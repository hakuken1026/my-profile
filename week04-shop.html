<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オンラインショップ - 商品一覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
    <!-- ヘッダー -->
    <header class="bg-white shadow flex justify-between items-center p-4">
    <div class="text-gray-900 font-bold text-lg">POSSE shop</div>
    <div class="text-gray-700 flex gap-4 text-sm">About  Works  Contact</div>
    </header>

    <!-- メイン -->
    <main class="max-w-5xl mx-auto px-6 py-8">
        <h1 class="text-2xl font-bold mb-2">商品一覧</h1>

        <!-- 商品グリッド（要件：スマホ1〜2列、PCで4列程度） -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- カード（8枚以上） -->
        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">👟</div>
            <h2 class="font-bold">スニーカー</h2>
            <p class="text-slate-500 text-sm mt-1">¥8,800</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">🧣</div>
            <h2 class="font-bold">マフラー</h2>
            <p class="text-slate-500 text-sm mt-1">¥4,000</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">👒</div>
            <h2 class="font-bold">帽子</h2>
            <p class="text-slate-500 text-sm mt-1">¥5,300</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">⌚</div>
            <h2 class="font-bold">腕時計</h2>
            <p class="text-slate-500 text-sm mt-1">¥98,800</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">📒</div>
            <h2 class="font-bold">ノート</h2>
            <p class="text-slate-500 text-sm mt-1">¥500</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">💻</div>
            <h2 class="font-bold">ノートパソコン</h2>
            <p class="text-slate-500 text-sm mt-1">¥118,800</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">👜</div>
            <h2 class="font-bold">カバン</h2>
            <p class="text-slate-500 text-sm mt-1">¥9,800</p>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-4 hover:shadow-lg hover:scale-105">
            <div class="text-4xl mb-3">👓</div>
            <h2 class="font-bold">スターク社の眼鏡</h2>
            <p class="text-slate-500 text-sm mt-1">¥432,000,000</p>
        </div>

        
    </section>
    </main>
</body>
</html>
