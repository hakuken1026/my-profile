<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-emerald-100 text-gray-900">
    <!-- ヘッダー -->
    <header class="bg-white backdrop-blur shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-5">
        <div class="flex items-center justify-between gap-4">
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">MORI CAFE</h1>
        <span class="text-sm font-semibold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">週替わりメニュー</span>
        </div>
        <p class="mt-2 text-sm text-gray-600">木々の香りに包まれる、やさしい森のカフェ。</p>
    </div>
    </header>

    <!-- メイン -->
    <main class="max-w-3xl mx-auto px-4 py-10">
        <!-- ドリンク -->
        <section class="mb-10">
        <h2 class="text-xl font-bold text-gray-800 mb-4">ドリンク</h2>
        
        <div class="bg-white rounded-lg shadow p-6 mb-4">
        <h2 class="text-xl text-gray-800 font-bold">トトロのコーヒー</h2>
        <p class="text-base text-gray-600">森の香りとトトロを感じることができます</p>
        <p class="text-semibold text-gray-700 mt-2">500円</p>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6 mb-4">
        <h2 class="text-xl text-gray-800 font-bold">まっくろくろすけが入ったカフェラテ</h2>
        <p class="text-base text-gray-600">香ばしいゴマと深いコクが特徴的です</p>
        <p class="text-semibold text-gray-700 mt-2">400円</p>
        </div>
        </section>

        <!-- フード -->
        <section class="mb-10">
        <h2 class="text-xl font-bold text-gray-800 mb-4">フード</h2>
        
        <div class="bg-white rounded-lg shadow p-6 mb-4">
        <h2 class="text-xl text-gray-800 font-bold">トトロの肉</h2>
        <p class="text-base text-gray-600">ジューシーで肉厚です</p>
        <p class="text-semibold text-gray-700 mt-2">700円</p>
        </div>
        
        <div class="bg-white rounded-lg shadow p-6 mb-4">
        <h2 class="text-xl text-gray-800 font-bold">クロワッサン</h2>
        <p class="text-base text-gray-600">外はサクサクで中はふわふわです</p>
        <p class="text-semibold text-gray-700 mt-2">400円</p>
        </div>
        </section>

        <button class="w-full bg-white text-emerald-800 text-sm font-bold px-4 py-2 rounded-md hover:shadow-lg">
        カートに入れる
        </button>
    
    </main>    
</body>
</html>
