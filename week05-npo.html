<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学びを支えるNPO - トップ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
    <!-- ヘッダー -->
<header class="bg-black shadow">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div class="font-bold text-white text-lg">
        テント
        <span class="block text-xs font-semibold text-red-700 mt-1">NPO / こども支援</span>
        </div>

        <nav class="flex flex-col md:flex-row gap-2 md:gap-5 text-sm">
        <a class="text-slate-700 text-white hover:text-red-700 font-semibold" href="#">概要</a>
        <a class="text-slate-700 text-white hover:text-red-700 font-semibold" href="#">活動内容</a>
        <a class="text-slate-700 text-white hover:text-red-700 font-semibold" href="#">お問い合わせ</a>
        </nav>
    </div>
    </header>

    <!-- メイン -->
    <main class="max-w-5xl mx-auto px-6 py-10">
    <!-- ヒーロー -->
    <section class="bg-white rounded-2xl shadow p-6 md:p-8">
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900">
        ジャミーンのような子供を助けたい！！
        </h1>
        <p class="text-slate-600 mt-3">
        経済的に困難を抱える子どもたちに、学習機会とサポートを提供しています。
        </p>

        <div class="mt-6 flex flex-col md:flex-row gap-3">
        <button class="inline-block text-center bg-black text-white px-6 py-3 rounded-lg font-bold hover:bg-red-700 transition">ボランティアに申し込む</button>
        <button class="inline-block text-center bg-black text-white px-6 py-3 rounded-lg font-bold hover:bg-red-700 transition">活動内容を見る</button>
        </div>
    </section>

    <!-- カードエリア -->
    <section class="mt-8">
        <h2 class="text-xl font-bold text-slate-900 mb-4">活動メニュー</h2>

        <!-- 要件：スマホ1列 / PC3列 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- カード1 -->
        <article class="bg-white rounded-xl shadow p-5">
            <div class="text-3xl mb-2">📚</div>
            <h3 class="font-bold text-slate-900">学習サポート</h3>
            <p class="text-sm text-slate-600 mt-2">
            放課後の個別学習と、つまずきの原因を一緒に整理します。
            </p>
            <a class="mt-4 text-sm font-bold text-emerald-700 hover:underline" href="#">
            詳しく見る →
            </a>
        </article>

        <!-- カード2 -->
        <article class="bg-white rounded-xl shadow p-5">
            <div class="text-3xl mb-2">🧠</div>
            <h3 class="font-bold text-slate-900">学びの相談会</h3>
            <p class="text-sm text-slate-600 mt-2">
            家庭の状況に合わせた学習計画を提案し、伴走します。
            </p>
            <a class="mt-4 text-sm font-bold text-emerald-700 hover:underline" href="#">
            詳しく見る →
            </a>
        </article>

        <!-- カード3 -->
        <article class="bg-white rounded-xl shadow p-5">
            <div class="text-3xl mb-2">🤝</div>
            <h3 class="font-bold text-slate-900">地域ボランティア</h3>
            <p class="text-sm text-slate-600 mt-2">
            教室運営の補助やイベントのサポートをしていただきます。
            </p>
            <a class="mt-4 text-sm font-bold text-emerald-700 hover:underline" href="#">
            詳しく見る →
            </a>
        </article>
        </div>
    </section>
    </main>

    <!-- フッター -->
    <footer class="bg-slate-900 text-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-6 text-sm">
        &copy; 2026 テント / こども支援NPO
    </div>
    </footer>
</body>
</html>
